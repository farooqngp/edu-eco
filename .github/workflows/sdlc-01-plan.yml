name: SDLC 01 - Plan (entry point)

on:
  issues:
    types: [assigned, labeled]

concurrency:
  group: sdlc-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    if: >
      (github.event.action == 'assigned' && github.event.issue.assignee != null) ||
      (github.event.action == 'labeled' && github.event.label.name == 'sdlc:planning' && github.event.sender.type != 'Bot')
    uses: ./.github/workflows/sdlc-plan-agent.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      mode: initial
    secrets: inherit
