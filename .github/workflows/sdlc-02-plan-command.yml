name: SDLC 02 - Plan Command

on:
  issue_comment:
    types: [created]

concurrency:
  group: sdlc-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  gate:
    # Only plain issues, never PR comments (PR review comments are handled by
    # sdlc-04/sdlc-05). github.event.issue.pull_request only exists on PR comments.
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENTER: ${{ github.event.comment.user.login }}
      COMMENT_BODY: ${{ github.event.comment.body }}
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      payload: ${{ steps.parse.outputs.payload }}
      current_label: ${{ steps.meta.outputs.current_label }}
      revisions_used: ${{ steps.version.outputs.revisions_used }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Generate app token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app_id: ${{ secrets.SDLC_APP_ID }}
          private_key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}

      - name: Export token to job environment
        run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Save comment body to file
        run: |
          printf '%s' "$COMMENT_BODY" > /tmp/comment.txt

      - name: Parse command
        id: parse
        run: bash .github/scripts/parse-command.sh /tmp/comment.txt

      - name: Fetch issue metadata
        id: meta
        run: |
          DATA=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json assignees,labels)
          ASSIGNEE=$(echo "$DATA" | jq -r '.assignees[0].login // ""')
          LABELS=$(echo "$DATA" | jq -r '[.labels[].name] | join(",")')
          echo "assignee=$ASSIGNEE" >> "$GITHUB_OUTPUT"
          CURRENT_LABEL=""
          for L in sdlc:awaiting-plan-approval sdlc:revision-limit-reached sdlc:planning-failed sdlc:rejected sdlc:planning; do
            case ",$LABELS," in
              *",$L,"*) CURRENT_LABEL="$L"; break ;;
            esac
          done
          echo "current_label=$CURRENT_LABEL" >> "$GITHUB_OUTPUT"

      - name: Check permission
        id: auth
        env:
          ISSUE_ASSIGNEE: ${{ steps.meta.outputs.assignee }}
        run: |
          if bash .github/scripts/check-permission.sh "$REPO" "$COMMENTER" "$ISSUE_ASSIGNEE"; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute revision count
        id: version
        run: |
          eval "$(bash .github/scripts/plan-version.sh "$REPO" "$ISSUE_NUMBER" | sed 's/^/PV_/')"
          REVISIONS_USED=$((PV_plans_since_boundary - 1))
          if [ "$REVISIONS_USED" -lt 0 ]; then REVISIONS_USED=0; fi
          echo "revisions_used=$REVISIONS_USED" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          COMMAND: ${{ steps.parse.outputs.command }}
          AUTHORIZED: ${{ steps.auth.outputs.authorized }}
          CURRENT_LABEL: ${{ steps.meta.outputs.current_label }}
          REVISIONS_USED: ${{ steps.version.outputs.revisions_used }}
          PAYLOAD: ${{ steps.parse.outputs.payload }}
        run: |
          DECISION="do-nothing"
          if [ "$COMMAND" != "none" ]; then
            if [ "$AUTHORIZED" != "true" ]; then
              DECISION="unauthorized"
            else
              case "$COMMAND" in
                replan)
                  case "$CURRENT_LABEL" in
                    ""|"sdlc:planning-failed"|"sdlc:rejected") DECISION="replan" ;;
                    *) DECISION="invalid-state" ;;
                  esac
                  ;;
                approve)
                  case "$CURRENT_LABEL" in
                    "sdlc:awaiting-plan-approval"|"sdlc:revision-limit-reached") DECISION="approve" ;;
                    *) DECISION="invalid-state" ;;
                  esac
                  ;;
                reject)
                  case "$CURRENT_LABEL" in
                    "sdlc:awaiting-plan-approval"|"sdlc:revision-limit-reached")
                      if [ -z "$PAYLOAD" ]; then DECISION="missing-payload"; else DECISION="reject"; fi
                      ;;
                    *) DECISION="invalid-state" ;;
                  esac
                  ;;
                revise)
                  case "$CURRENT_LABEL" in
                    "sdlc:awaiting-plan-approval")
                      if [ -z "$PAYLOAD" ]; then
                        DECISION="missing-payload"
                      elif [ "$REVISIONS_USED" -ge 3 ]; then
                        DECISION="invalid-state"
                      else
                        DECISION="revise"
                      fi
                      ;;
                    *) DECISION="invalid-state" ;;
                  esac
                  ;;
              esac
            fi
          fi
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"

  do-replan:
    needs: gate
    if: needs.gate.outputs.decision == 'replan'
    uses: ./.github/workflows/sdlc-plan-agent.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      mode: initial
    secrets: inherit

  do-revise:
    needs: gate
    if: needs.gate.outputs.decision == 'revise'
    uses: ./.github/workflows/sdlc-plan-agent.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      mode: revise
      feedback: ${{ needs.gate.outputs.payload }}
    secrets: inherit

  do-approve:
    needs: gate
    if: needs.gate.outputs.decision == 'approve'
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENTER: ${{ github.event.comment.user.login }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate app token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app_id: ${{ secrets.SDLC_APP_ID }}
          private_key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}

      - name: Export token to job environment
        run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Find latest plan comment
        id: find
        run: |
          COMMENT_ID=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | test("## 📋 Development Plan"))] | last | .id // empty')
          echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Lock plan and start development
        env:
          COMMENT_ID: ${{ steps.find.outputs.comment_id }}
        run: |
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=rocket >/dev/null || true
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
            "🔒 Plan approved by @${COMMENTER} — locked for implementation. Starting Phase 1."
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
            --remove-label "sdlc:awaiting-plan-approval,sdlc:revision-limit-reached" \
            --add-label "sdlc:plan-approved,sdlc:in-development,sdlc:phase-ready"

  do-reject:
    needs: gate
    if: needs.gate.outputs.decision == 'reject'
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENTER: ${{ github.event.comment.user.login }}
      REASON: ${{ needs.gate.outputs.payload }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate app token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app_id: ${{ secrets.SDLC_APP_ID }}
          private_key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}

      - name: Export token to job environment
        run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Mark rejected
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" \
            --remove-label "sdlc:awaiting-plan-approval,sdlc:revision-limit-reached" \
            --add-label "sdlc:rejected"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
            "❌ Plan rejected by @${COMMENTER}:

          $REASON

          Comment \`/replan\` when ready to restart planning."

  do-feedback:
    needs: gate
    if: >
      needs.gate.outputs.decision == 'unauthorized' ||
      needs.gate.outputs.decision == 'invalid-state' ||
      needs.gate.outputs.decision == 'missing-payload'
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      DECISION: ${{ needs.gate.outputs.decision }}
      CURRENT_LABEL: ${{ needs.gate.outputs.current_label }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate app token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app_id: ${{ secrets.SDLC_APP_ID }}
          private_key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}

      - name: Export token to job environment
        run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: React or comment
        run: |
          if [ "$DECISION" = "unauthorized" ]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true
            exit 0
          fi
          if [ "$DECISION" = "missing-payload" ]; then
            MSG="This command needs a reason/feedback after it, e.g. \`/reject not aligned with requirement X\` or \`/revise please also handle Y\`."
          else
            MSG="That command isn't valid in the current state (\`${CURRENT_LABEL:-none}\`). Use \`/replan\`, \`/approve\`, \`/reject <reason>\`, or \`/revise <feedback>\` as appropriate for where this issue currently is."
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$MSG"
