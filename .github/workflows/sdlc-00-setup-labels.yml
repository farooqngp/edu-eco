name: SDLC 00 - Setup Labels

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/sdlc-00-setup-labels.yml

jobs:
  setup-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate app token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app_id: ${{ secrets.SDLC_APP_ID }}
          private_key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}

      - name: Export token to job environment
        run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Create/update SDLC label taxonomy
        run: |
          set -e
          declare -A LABELS=(
            ["sdlc:planning"]="0e8a16:Agent is drafting a development plan"
            ["sdlc:planning-failed"]="b60205:Planning job errored; comment /replan to retry"
            ["sdlc:awaiting-plan-approval"]="fbca04:Plan posted, waiting on assignee response"
            ["sdlc:rejected"]="b60205:Plan rejected by assignee"
            ["sdlc:revision-limit-reached"]="d93f0b:3 revisions used; must /approve or /reject"
            ["sdlc:plan-approved"]="0e8a16:Plan was locked for implementation"
            ["sdlc:phase-ready"]="c5def5:Trigger label consumed by sdlc-03 to start a phase"
            ["sdlc:in-development"]="1d76db:Implementation in progress"
            ["sdlc:in-review"]="fbca04:Phase PR open, awaiting human review"
            ["sdlc:changes-requested"]="d93f0b:Reviewer requested changes; agent addressing"
            ["sdlc:blocked"]="e11d21:Automation halted, needs human"
            ["sdlc:done"]="0e8a16:All phases merged, issue complete"
          )
          for NAME in "${!LABELS[@]}"; do
            IFS=':' read -r COLOR DESC <<< "${LABELS[$NAME]}"
            if gh label list --repo "${{ github.repository }}" --json name --jq '.[].name' | grep -qx -- "$NAME"; then
              gh label edit "$NAME" --repo "${{ github.repository }}" --color "$COLOR" --description "$DESC"
            else
              gh label create "$NAME" --repo "${{ github.repository }}" --color "$COLOR" --description "$DESC"
            fi
          done
