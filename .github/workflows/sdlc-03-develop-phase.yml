name: SDLC 03 - Develop Phase

on:
  issues:
    types: [labeled]

concurrency:
  group: sdlc-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  develop:
    if: github.event.label.name == 'sdlc:phase-ready'
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Generate app token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app_id: ${{ secrets.SDLC_APP_ID }}
          private_key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}

      - name: Export token to job environment
        run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Configure git to use bot token
        run: gh auth setup-git

      - name: Consume trigger label
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label "sdlc:phase-ready" || true

      - name: Determine phase number and total phases
        id: phase
        env:
          ISSUE_TITLE_RAW: ${{ github.event.issue.title }}
        run: |
          PLAN_BODY=$(gh api "repos/$REPO/issues/$ISSUE_NUMBER/comments" --paginate \
            --jq '[.[] | select(.body | test("## 📋 Development Plan"))] | last | .body')
          TOTAL_PHASES=$(printf '%s' "$PLAN_BODY" | grep -oP '(?<=phases=)\d+' | head -n1)
          if [ -z "$TOTAL_PHASES" ]; then
            echo "::error::Could not find phases= marker on the locked plan comment for #$ISSUE_NUMBER"
            exit 1
          fi

          MERGED_COUNT=$(gh pr list --repo "$REPO" --base dev --state merged --limit 200 \
            --json headRefName | jq --arg pfx "feature/$ISSUE_NUMBER-" \
            '[.[] | select(.headRefName | startswith($pfx))] | length')
          PHASE_NUMBER=$((MERGED_COUNT + 1))

          if [ "$PHASE_NUMBER" -gt "$TOTAL_PHASES" ]; then
            echo "::error::Phase $PHASE_NUMBER exceeds plan's total phases ($TOTAL_PHASES) for #$ISSUE_NUMBER"
            exit 1
          fi

          SLUG=$(printf '%s' "$ISSUE_TITLE_RAW" | tr '[:upper:]' '[:lower:]' | \
            sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40)
          BRANCH_NAME="feature/${ISSUE_NUMBER}-${SLUG}-phase-${PHASE_NUMBER}"

          echo "total_phases=$TOTAL_PHASES" >> "$GITHUB_OUTPUT"
          echo "phase_number=$PHASE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create phase branch
        env:
          BRANCH_NAME: ${{ steps.phase.outputs.branch_name }}
        run: |
          git config user.name "sdlc-bot"
          git config user.email "sdlc-bot@users.noreply.github.com"
          git fetch origin dev
          git checkout -b "$BRANCH_NAME" origin/dev
          git push -u origin "$BRANCH_NAME"

      - name: Render implementation prompt
        id: render
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BRANCH_NAME: ${{ steps.phase.outputs.branch_name }}
          PHASE_NUMBER: ${{ steps.phase.outputs.phase_number }}
          TOTAL_PHASES: ${{ steps.phase.outputs.total_phases }}
        run: |
          DELIM="SDLC_EOF_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${RANDOM}${RANDOM}"
          {
            echo "prompt<<$DELIM"
            bash .github/scripts/render-template.sh .github/prompts/implement-phase.md \
              "ISSUE_NUMBER=$ISSUE_NUMBER" \
              "REPO=$REPO" \
              "BRANCH_NAME=$BRANCH_NAME" \
              "PHASE_NUMBER=$PHASE_NUMBER" \
              "TOTAL_PHASES=$TOTAL_PHASES" \
              "ASSIGNEE=${{ github.event.issue.assignee.login }}"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Run implementation agent
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ env.GH_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ steps.phase.outputs.branch_name }}
          prompt: ${{ steps.render.outputs.prompt }}
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Grep,Glob"

      - name: Mark in-review
        if: steps.claude.outputs.conclusion == 'success'
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "sdlc:in-review" || true

      - name: Mark blocked on failure
        if: steps.claude.outputs.conclusion != 'success'
        env:
          PHASE_NUMBER: ${{ steps.phase.outputs.phase_number }}
          TOTAL_PHASES: ${{ steps.phase.outputs.total_phases }}
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label "sdlc:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body \
            "🚧 Phase ${PHASE_NUMBER}/${TOTAL_PHASES} implementation failed to complete (job conclusion: ${CONCLUSION}). Needs manual investigation on branch \`${{ steps.phase.outputs.branch_name }}\`. Once fixed, re-add the \`sdlc:phase-ready\` label to retry this phase."
