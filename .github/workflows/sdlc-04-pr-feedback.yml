name: SDLC 04 - PR Review Feedback

on:
  pull_request_review:
    types: [submitted]

concurrency:
  group: sdlc-pr-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  address-feedback:
    if: github.event.review.state == 'changes_requested' && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
      REVIEWER: ${{ github.event.review.user.login }}
    steps:
      # Only PRs this pipeline created (feature/{issue}-...-phase-{n}) are in scope; a
      # normal contributor PR into dev must not be touched by this automation.
      - name: Guard managed branch and resolve issue number
        id: resolve
        run: |
          if [[ ! "$BRANCH_NAME" =~ ^feature/([0-9]+)-.*-phase-[0-9]+$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "issue_number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.resolve.outputs.skip == 'false'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Generate app token
        id: app-token
        if: steps.resolve.outputs.skip == 'false'
        uses: ./.github/actions/app-token
        with:
          app_id: ${{ secrets.SDLC_APP_ID }}
          private_key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}

      - name: Export token to job environment
        if: steps.resolve.outputs.skip == 'false'
        run: echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> "$GITHUB_ENV"

      - name: Configure git to use bot token
        if: steps.resolve.outputs.skip == 'false'
        run: gh auth setup-git

      - name: Determine attempt number
        id: attempt
        if: steps.resolve.outputs.skip == 'false'
        run: |
          USED=$(git log --oneline | grep -c '^[a-f0-9]\+ fix: address review feedback' || true)
          echo "attempt=$((USED + 1))" >> "$GITHUB_OUTPUT"

      - name: Mark changes-requested
        if: steps.resolve.outputs.skip == 'false' && fromJSON(steps.attempt.outputs.attempt) <= 3
        run: |
          gh issue edit "${{ steps.resolve.outputs.issue_number }}" --repo "$REPO" \
            --remove-label "sdlc:in-review" --add-label "sdlc:changes-requested" || true

      - name: Render address-review prompt
        id: render
        if: steps.resolve.outputs.skip == 'false' && fromJSON(steps.attempt.outputs.attempt) <= 3
        env:
          ATTEMPT: ${{ steps.attempt.outputs.attempt }}
          ISSUE_NUMBER: ${{ steps.resolve.outputs.issue_number }}
        run: |
          DELIM="SDLC_EOF_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${RANDOM}${RANDOM}"
          {
            echo "prompt<<$DELIM"
            bash .github/scripts/render-template.sh .github/prompts/address-review.md \
              "PR_NUMBER=$PR_NUMBER" \
              "REPO=$REPO" \
              "BRANCH_NAME=$BRANCH_NAME" \
              "ISSUE_NUMBER=$ISSUE_NUMBER" \
              "ATTEMPT_NUMBER=$ATTEMPT"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Run fix agent
        id: claude
        if: steps.resolve.outputs.skip == 'false' && fromJSON(steps.attempt.outputs.attempt) <= 3
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ env.GH_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ github.event.pull_request.head.ref }}
          prompt: ${{ steps.render.outputs.prompt }}
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Grep,Glob"

      - name: Mark blocked (attempt cap exceeded)
        if: steps.resolve.outputs.skip == 'false' && fromJSON(steps.attempt.outputs.attempt) > 3
        run: |
          gh issue edit "${{ steps.resolve.outputs.issue_number }}" --repo "$REPO" --add-label "sdlc:blocked" || true
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "🚧 3 automated fix attempts have been used on this PR without resolving review feedback. Needs manual attention from @${REVIEWER} or the assignee."

      - name: Mark blocked (agent failure)
        if: >
          steps.resolve.outputs.skip == 'false' &&
          fromJSON(steps.attempt.outputs.attempt) <= 3 &&
          steps.claude.outputs.conclusion != 'success'
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          gh issue edit "${{ steps.resolve.outputs.issue_number }}" --repo "$REPO" --add-label "sdlc:blocked" || true
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "🚧 Automated fix attempt failed to complete (job conclusion: ${CONCLUSION}). Needs manual attention."
